<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Haseeb Shop — Product Management Platform</title>
    <meta name="description" content="Haseeb Shop is a full-stack product management platform with Admin and Customer panels. Browse products, manage inventory, and shop with multi-currency support." />
    <meta name="keywords" content="haseeb shop, product management, ecommerce, online store, admin panel, shopping cart, inventory management" />
    <meta name="author" content="Haseeb" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#17252A" />
    <link rel="canonical" href="https://haseebshop.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://haseebshop.com/" />
    <meta property="og:title" content="Haseeb Shop — Product Management Platform" />
    <meta property="og:description" content="Browse and manage products with Haseeb Shop. Admin panel for inventory, customer panel for shopping." />
    <meta property="og:image" content="https://haseebshop.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Haseeb Shop" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://haseebshop.com/" />
    <meta name="twitter:title" content="Haseeb Shop — Product Management Platform" />
    <meta name="twitter:description" content="Browse and manage products with Haseeb Shop. Admin panel for inventory, customer panel for shopping." />
    <meta name="twitter:image" content="https://haseebshop.com/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Haseeb Shop",
      "url": "https://haseebshop.com",
      "description": "Full-stack product management platform with Admin and Customer panels",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://haseebshop.com/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Haseeb Shop",
      "url": "https://haseebshop.com",
      "logo": "https://haseebshop.com/logo.png",
      "sameAs": []
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
